name = "iswdri"
main = "dist/server/index.mjs"
compatibility_date = "2026-08-09"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "imamshahwaliullahbd.com", custom_domain = true },
  { pattern = "test.imamshahwaliullahbd.com", custom_domain = true },
]

[assets]
directory = "dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "imamshahwaliullahbd"
database_id = "caa0c376-3e10-47c2-8c9c-59d55799f439"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "iswdri-images"

[[r2_buckets]]
binding = "PDFS"
bucket_name = "iswdri-pdfs"
